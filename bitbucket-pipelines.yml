# This is a sample build configuration for PHP.
# Check our guides at https://confluence.atlassian.com/x/e8YWN for more examples.
# Only use spaces to indent your .yml configuration.
# -----
# You can specify a custom docker image from Docker Hub as your build environment.


pipelines:

  default:
    - step:
        name: PHPUnit and Codeception tests
        image: forwardhkg/basis-php-test
        caches:
          - composer
        script:

          - composer config -g github-oauth.github.com $GITHUB_OAUTHTOKEN
          - composer install

          - mysql -h127.0.0.1 -uroot -ptest -e "create database pls_test"
          - mysql -h127.0.0.1 -uroot -ptest pls_test < tests/_data/pls_test.sql

          - mv config/config_test.php config/config.php
          - mkdir uploads
          - ln -s `pwd`/public/lightpublic src/Light/public

          - php public/index.php Light/Migrate

          - vendor/bin/phpunit -c tests/phpunit.xml --log-junit ./test-reports/phpunit2.xml
          - vendor/bin/codecept build
          - vendor/bin/codecept run functional --skip-group download --xml test-reports/junit.xml

        services:
          - database

    - step:
        name: Deploy to Production
        image: forwardhkg/ansible
        deployment: production
        trigger: manual
        script:
          - cd ansible
          - echo $VAULT_PASS > .vault-pass
          - ansible-playbook --vault-password-file .vault-pass --tags=code,conf,migrate,sentry,cron --extra-vars "git_version=$BITBUCKET_COMMIT" playbook_08_deploy_pls.yml
          - ansible-playbook --vault-password-file .vault-pass --tags=code,conf,migrate,sentry,cron --extra-vars "git_version=$BITBUCKET_COMMIT" playbook_09_deploy_flowerbase.yml


definitions:
  services:
    database:
      image: mysql:5.6
      environment:
        MYSQL_ROOT_PASSWORD: test
