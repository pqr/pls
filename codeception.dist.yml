actor: Tester
paths:
    tests: tests
    log: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs
settings:
    colors: false
    memory_limit: 1024M
extensions:
    enabled:
        - Codeception\Extension\RunFailed
coverage:
    enabled: true
    remote: false
    whitelist:
        include:
            - www/*/*.php
        exclude:
            - www/Light/External/*
            - www/Light/Tests/*
            - www/Light/Codeception/*
modules:
    config:
        PhpBrowser:
            url: http://book4a.test
        REST:
            url: http://book4a.test
        \Light\Codeception\AdminSessionHelper:
            username: admin
            password: changeme in codeception.yml local file
