actor: Tester
paths:
    tests: tests
    log: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs
settings:
    bootstrap: _bootstrap.php
    colors: false
    memory_limit: 1024M
extensions:
    enabled:
        - Codeception\Extension\RunFailed
coverage:
    enabled: true
    remote: false
    whitelist:
        include:
            - www/*/*.php
        exclude:
            - www/Light/External/*
            - www/Light/Tests/*
            - www/Light/Codeception/*
modules:
    config:
        Db:
            dsn: 'mysql:host=127.0.0.1;dbname=pls'
            user: 'root'
            password: '1234'
            dump: tests/_data/dump.sql
            populate: true
            cleanup: false
            reconnect: false
        PhpBrowser:
            url: http://localhost/book4a/www
        REST:
            url: http://localhost/book4a/www
        \Light\Codeception\AdminSessionHelper:
            username: admin
            password: changeme in codeception.yml local file