# Example: ansible-playbook 04_install_composer.yml
- hosts: []
  become: true
  become_user: root
  become_method: sudo

  tasks:
  - name: Check if Composer is installed
    stat: path=/usr/local/bin/composer
    register: composer_bin
    tags: composer

  - name: Download Composer installer (if not installed yet)
    get_url:
      url: https://getcomposer.org/installer
      dest: /tmp/composer-installer.php
      mode: 0755
    when: not composer_bin.stat.exists
    tags: composer

  - name: Install composer from installer (if not installed yet)
    become: true
    command: php /tmp/composer-installer.php --install-dir=/usr/local/bin --filename=composer
    when: not composer_bin.stat.exists
    tags: composer

  - name: Update Composer to latest version (if installed before)
    become: true
    command: composer self-update
    when: composer_bin.stat.exists
    tags: composer
