# Example: ansible-playbook 09_deploy_flowerbase.yml -i inventory.test --tags=nginx
- hosts: all
  become: false
  vars_files:
  - vars_decrypted.yml
  - vars_encrypted.yml

  tasks:
  # Установить deploy ssh key (если его нет или отличается):
  - name: Copy id_rsa to user folder
    copy: content={{ id_rsa }} dest=/home/{{ ansible_user }}/.ssh/id_rsa mode=0600 owner=ubuntu group=ubuntu
    tags: key

  # Клонировать репозиторий prod website (и затереть изменения если были):
  - name: Clone git repo to {{ project_dir_flowerbase }}
    git:
      repo: git@bitbucket.org:pqr/pls.git
      dest: "{{ project_dir_flowerbase }}"
      version: "{{ git_version }}"
      clone: yes
      force: yes
      accept_hostkey: true
    tags: code

  # Проверить папки logs и temp и права 777 на них:
  - name: Check logs and temp folders and mode
    become: true
    file:
      path: "{{ item }}"
      state: directory
      mode: u=rwX,g=rwX,o=rwX
      recurse: yes
    with_items:
      - "{{ project_dir_flowerbase }}/logs"
      - "{{ project_dir_flowerbase }}/temp"
      - "{{ filesfolder_flowerbase }}"
    tags: dirs

  # Установить файл config.php с переменными
  - name: Copy config.php
    template:
      src: files/config_flowerbase.php
      dest: "{{ project_dir_flowerbase }}/config/config.php"
      backup: yes
    tags: conf

    # Создать символические ссылки на папки для nginx
  - name: Create lightpublic symlink
    file:
      state: link
      src: "{{ project_dir_flowerbase }}/src/Light/public"
      path: "{{ project_dir_flowerbase }}/public/lightpublic"
    tags: dirs

  - name: Run Deploy script
    shell: "{{ project_dir_flowerbase }}/up.sh"
    args:
      chdir: "{{ project_dir_flowerbase }}"
      executable: /bin/bash
    tags: code
