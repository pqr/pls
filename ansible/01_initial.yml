# Example: ansible-playbook playbook_01_initial.yml
- hosts: []
  become: true
  become_user: root
  become_method: sudo
  vars_files:
    - vars_decrypted.yml

  tasks:
  # Установка Timezone:
  - name: initial 1. Setting timezone to Moscow
    timezone: name=Europe/Moscow
    tags: timezone

  # Обновление кеша apt:
  - name: initial 2. Update package cache
    apt: update_cache=true
    changed_when: no
    tags: cache

  # Установка python-software-properties
  - name: initial 3. install python-software-properties
    apt: name=python-software-properties
    tags: python

  - name: initial 4. locale_gen
    locale_gen:
      name: ru_RU.UTF-8
      state: present
    tags: locale

  - name: Set authorized keys
    authorized_key:
      user: ubuntu
      state: present
      key: "{{ bitbucket_pipeline_public_key_app }}"
    tags: ssh
