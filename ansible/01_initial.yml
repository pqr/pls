# Example: ansible-playbook 01_initial.yml
- hosts: all
  become: true
  vars_files:
    - vars_decrypted.yml

  tasks:
  # Установка Timezone:
  - name: initial 1. Setting timezone to Moscow
    timezone: name=Europe/Moscow
    tags: timezone

  # Обновление кеша apt:
  - name: initial 2. Update package cache
    apt: update_cache=true
    changed_when: no
    tags: cache

  - name: install software-properties-common
    apt: name=software-properties-common

  - name: Install locales
    apt:
      name: locales
    tags: locale

  - name: locale_gen ru_RU
    locale_gen:
      name: ru_RU
      state: present
    tags: locale

  - name: locale_gen ru_RU.UTF-8
    locale_gen:
      name: ru_RU.UTF-8
      state: present
    tags: locale

  - name: Set authorized keys
    authorized_key:
      user: ubuntu
      state: present
      key: "{{ bitbucket_pipeline_public_key_app }}"
    tags: ssh
