# Example: ansible-playbook playbook_deploy_webserver.yml -i inventory.test --tags=nginx
- hosts: []
  become: false
  vars_files:
  - vars_decrypted.yml
  - vars_encrypted.yml

  tasks:
  # Установить deploy ssh key (если его нет или отличается):
  - name: deploy pls 1. Copy id_rsa to user folder
    copy: content={{ id_rsa }} dest=/home/ubuntu/.ssh/id_rsa mode=0600 owner=ubuntu group=ubuntu
    tags: key

  # Клонировать репозиторий prod website (и затереть изменения если были):
  - name: deploy pls 2. Clone git repo
    git:
      repo: git@bitbucket.org:pqr/pls.git
      dest: "{{ project_dir_pls }}"
      clone: yes
      force: yes
      accept_hostkey: true
    tags: code

  # Проверить папки logs и temp и права 777 на них:
  - name: deploy pls 3. Check logs and temp folders and mode
    file: path={{ item }} state=directory mode=0777
    with_items:
      - "{{ project_dir_pls }}/logs"
      - "{{ project_dir_pls }}/temp"
    tags: dirs

  # Установить файл config.php с переменными
  - name: deploy pls 4. Copy config.php
    template:
      src: files/config_pls.php
      dest: "{{ project_dir_pls }}/config/config.php"
      backup: yes
    tags: conf

  - name: deploy pls 5. Install composer deps
    composer:
      command: install
      working_dir: "{{ project_dir_pls }}"
      no_dev: true
    tags: code

    # Создать символические ссылки на папки для nginx
  - name: deploy pls 6. Create lightpublic symlink
    file:
      state: link
      src: "{{ project_dir_pls }}/src/Light/public"
      path: "{{ project_dir_pls }}/public/lightpublic"
    tags: dirs

  - name: deploy pls 7. Cron Light/CurrencyRateCBRF today at 6am
    become: false
    cron:
      name: "pls CurrencyRateCBRF today"
      minute: "0"
      hour: "6"
      job: "php {{ project_dir_pls }}/public/index.php Light/CurrencyRateCBRF today"
    tags: cron

  - name: deploy pls 8. Cron Light/CurrencyRateCBRF every 30 min 11-18
    become: false
    cron:
      name: "pls CurrencyRateCBRF"
      minute: "*/30"
      hour: "11-18"
      job: "php {{ project_dir_pls }}/public/index.php Light/CurrencyRateCBRF"
    tags: cron

  - name: deploy pls 9. Cron CitadeleCurrencyLoader every hour 9-21
    become: false
    cron:
      name: "pls CitadeleCurrencyLoader"
      minute: "0"
      hour: "9-21"
      job: "php {{ project_dir_pls }}/public/index.php CitadeleCurrencyLoader"
    tags: cron

  - name: deploy pls 10. Cron UpdateCustomerOutstandingCache at 8
    become: false
    cron:
      name: "pls UpdateCustomerOutstandingCache"
      minute: "0"
      hour: "8"
      job: "php {{ project_dir_pls }}/public/index.php UpdateCustomerOutstandingCache"
    tags: cron

  - name: deploy pls 11. Cron UpdateShipmentCriteria at 0:10
    become: false
    cron:
      name: "pls UpdateShipmentCriteria"
      minute: "10"
      hour: "0"
      job: "php {{ project_dir_pls }}/public/index.php UpdateShipmentCriteria"
    tags: cron

  - name: deploy pls 12. Cron Light/Email every minute
    become: false
    cron:
      name: "pls Light/Email"
      minute: "*"
      job: "php {{ project_dir_pls }}/public/index.php Light/Email"
    tags: cron

  - name: deploy pls 13. Cron EmailPendingQuotations14days at 16:30 working days
    become: false
    cron:
      name: "pls EmailPendingQuotations14days"
      minute: "30"
      hour: "16"
      weekday: "1-5"
      job: "php {{ project_dir_pls }}/public/index.php EmailPendingQuotations14days"
    tags: cron

  - name: deploy pls 14. Cron ImportCActFrom1C 8-23 every 5 min
    become: false
    cron:
      name: "pls ImportCActFrom1C"
      minute: "*/5"
      hour: "8-23"
      job: "php {{ project_dir_pls }}/public/index.php ImportCActFrom1C"
    tags: cron

  - name: deploy pls 15. Cron ImportCInvoicesFrom1C 8-23 every 5 min
    become: false
    cron:
      name: "pls ImportCInvoicesFrom1C"
      minute: "*/5"
      hour: "8-23"
      job: "php {{ project_dir_pls }}/public/index.php ImportCInvoicesFrom1C"
    tags: cron

  - name: deploy pls 16. Cron ImportCPaymentsFrom1C 8-23 every 5 min
    become: false
    cron:
      name: "pls ImportCPaymentsFrom1C"
      minute: "*/5"
      hour: "8-23"
      job: "php {{ project_dir_pls }}/public/index.php ImportCPaymentsFrom1C"
    tags: cron

