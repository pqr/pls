# Example: ansible-playbook 02_install_nginx.yml
- hosts: all
  become: true
  vars_files:
  - vars_decrypted.yml

  tasks:
  # Обновить apt cache:
  - name: Update cache
    apt: update_cache=true
    changed_when: no
    tags: cache

  # Установить nginx:
  - name: Install nginx
    apt: name=nginx state=latest
    tags: nginx

  # Установить конфигурацию nginx.conf
  - name: Copy sites-available/default
    template:
      src: files/etc/nginx/sites-available/default
      dest: /etc/nginx/sites-available/default
      backup: yes
    notify: reload nginx
    tags: conf

  # Установить конфигурацию nginx.conf
  - name: Copy sites-available/flowerbase
    template:
      src: files/etc/nginx/sites-available/flowerbase
      dest: /etc/nginx/sites-available/flowerbase
      backup: yes
    notify: reload nginx
    tags: conf

  - name: Create link for sites-enabled nginx style
    file: src={{ item.src }} dest={{ item.dest }} state=link
    with_items:
      - { src: "/etc/nginx/sites-available/default", dest: "/etc/nginx/sites-enabled/default" }
      - { src: "/etc/nginx/sites-available/flowerbase", dest: "/etc/nginx/sites-enabled/flowerbase" }
    notify: reload nginx
    tags: conf

  # Активировать и запустить nginx:
  - name: Enable nginx
    service: name=nginx state=started enabled=true
    tags: nginx

  handlers:
  - name: reload nginx
    service: name=nginx state=restarted enabled=true
