# Example: ansible-playbook playbook_03_install_php.yml
- hosts: []
  become: true
  become_user: root
  become_method: sudo
  vars_files:
   - vars_decrypted.yml

  tasks:
  # Обновить apt cache:
  - name: php 1. Update cache
    apt: update_cache=true
    changed_when: no
    tags: cache

  # Установить репозиторий php:
  - name: php 2. Add repository for Ubuntu
    apt_repository: repo={{ php_use_ppa }}
    tags: php

  # Установить нужные пакеты php:
  - name: php 3. Install base php packages
    apt: name={{ item }} state=latest
    with_items:
      - php-common
      - php{{ php_version }}-cli
      - php{{ php_version }}-common
      - php{{ php_version }}-curl
      - php{{ php_version }}-fpm
      - php{{ php_version }}-gd
      - php{{ php_version }}-imap
      - php{{ php_version }}-intl
      - php{{ php_version }}-json
      - php{{ php_version }}-mbstring
      - php{{ php_version }}-mysql
      - php{{ php_version }}-opcache
      - php{{ php_version }}-readline
      - php{{ php_version }}-xml
      - php{{ php_version }}-xsl
      - php{{ php_version }}-zip
    notify: reload nginx
    tags: php

  # Установить конфигурации php
  - name: php 4. Install configs for php{{ php_version }}
    template: src=files/{{ item }} dest=/{{ item }} backup=yes
    with_items:
      - etc/php/{{ php_version }}/cli/php.ini
      - etc/php/{{ php_version }}/fpm/php.ini
      - etc/php/{{ php_version }}/fpm/php-fpm.conf
      - etc/php/{{ php_version }}/fpm/pool.d/www.conf
    notify: reload php-fpm
    tags: conf

  handlers:
    - name: reload nginx
      service: name=nginx state=restarted enabled=true

    - name: reload php-fpm
      service: name=php{{ php_version }}-fpm state=restarted enabled=true
