# Example: ansible-playbook 06_install_toolkit.yml -i inventory.test
- hosts: all
  become: true
  vars_files:
   - vars_decrypted.yml
   - vars_encrypted.yml

  tasks:
  # Обновить apt cache:
  - name: Update cache
    apt: update_cache=true
    changed_when: no

  # Установить dependency libicu52 для wkhtmltopdf:
  - name: Install libicu52
    apt:
      deb: http://launchpadlibrarian.net/201330288/libicu52_52.1-8_amd64.deb
    tags: wkhtmltopdf

  # Установить dependency libxrender1 для wkhtmltopdf:
  - name: Install libxrender1
    apt:
      name: libxrender1
    tags: wkhtmltopdf

  - name: Install wkhtmltopdf
    apt:
      deb: https://downloads.wkhtmltopdf.org/0.12/0.12.5/wkhtmltox_0.12.5-1.xenial_amd64.deb
    tags:
      - tools
      - wkhtmltopdf

  # Установить нужные в работе утилиты:
  - name: Install tools
    apt: name={{ item }} state=latest
    with_items:
      - mc
      - curl
      - wget
      - htop
      - unzip
      - unrar
      - p7zip-full
      - ghostscript
      - imagemagick
      - git
      - pdftk
    tags: tools

  # Установить mysql-client:
  - name: Install mysql-client
    apt: name=mysql-client install_recommends=no
    tags: mysql

  - name: Copy .my.cnf
    become: false
    template:
      src: files/.my.cnf
      dest: /home/{{ ansible_user }}/.my.cnf
      backup: yes
      mode: 0600
    tags: mysql

  - name: Install Goss
    become: true
    get_url:
      url: https://github.com/aelsabbahy/goss/releases/download/v0.3.5/goss-linux-amd64
      dest: /usr/local/bin/goss
      mode: 0755
    tags:
    - tools
    - goss

  - name: goss.yaml to home directory
    become: false
    template:
      src: files/goss.yaml.j2
      dest: "/home/{{ ansible_user }}/goss.yaml"
    tags:
    - tools
    - goss

  - name: Sentry-cli
    become: false
    shell: "curl -sL https://sentry.io/get-cli/ | bash"
    tags: sentry

  - name: Copy .sentryclirc
    become: false
    template:
      src: files/.sentryclirc.j2
      dest: "/home/{{ ansible_user }}/.sentryclirc"
      mode: 0600
    tags: sentry
