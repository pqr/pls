# Example: ansible-playbook playbook_02_install_nginx.yml
- hosts: []
  become: true
  become_user: root
  become_method: sudo
  vars_files:
  - vars_decrypted.yml

  tasks:
  # Обновить apt cache:
  - name: nginx 1. Update cache
    apt: update_cache=true
    changed_when: no
    tags: cache

  # Установить nginx:
  - name: nginx 2. Install nginx
    apt: name=nginx
    tags: nginx

  # Установить конфигурацию nginx.conf
  - name: nginx 3. Copy sites-available/default
    template:
      src: files/etc/nginx/sites-available/default
      dest: /etc/nginx/sites-available/default
      backup: yes
    notify: reload nginx
    tags: conf

  # Установить конфигурацию nginx.conf
  - name: nginx 4. Copy sites-available/flowerbase
    template:
      src: files/etc/nginx/sites-available/flowerbase
      dest: /etc/nginx/sites-available/flowerbase
      backup: yes
    notify: reload nginx
    tags: conf

  - name: nginx 5. Create link for sites-enabled nginx style
    file: src={{ item.src }} dest={{ item.dest }} state=link
    with_items:
      - { src: "/etc/nginx/sites-available/default", dest: "/etc/nginx/sites-enabled/default" }
      - { src: "/etc/nginx/sites-available/flowerbase", dest: "/etc/nginx/sites-enabled/flowerbase" }
    notify: reload nginx
    tags: conf

  # Активировать и запустить nginx:
  - name: nginx 6. Enable nginx
    service: name=nginx state=started enabled=true
    tags: nginx

  handlers:
  - name: reload nginx
    service: name=nginx state=reloaded enabled=true
