# Example: ansible-playbook 09_deploy_pls.yml -i inventory.test
- hosts: all
  become: false
  vars_files:
  - vars_decrypted.yml
  - vars_encrypted.yml

  tasks:
  # Установить deploy ssh key (если его нет или отличается):
  - name: Copy id_rsa to user folder
    copy: content={{ id_rsa }} dest=/home/{{ ansible_user }}/.ssh/id_rsa mode=0600 owner=ubuntu group=ubuntu
    tags: key

  # Клонировать репозиторий prod website (и затереть изменения если были):
  - name: Clone git repo to {{ project_dir_pls }}
    git:
      repo: git@bitbucket.org:pqr/pls.git
      dest: "{{ project_dir_pls }}"
      version: "{{ git_version }}"
      clone: yes
      force: yes
      accept_hostkey: true
    tags: code

  - name: Install composer deps
    become: no
    composer:
      command: install
      working_dir: "{{ project_dir_pls }}"
      no_dev: true
      optimize_autoloader: true
    environment:
      COMPOSER_ALLOW_SUPERUSER: 1
    tags: code

  # Проверить папки logs и temp и права 777 на них:
  - name: Check logs and temp folders and mode
    become: true
    file:
      path: "{{ item }}"
      state: directory
      mode: u=rwX,g=rwX,o=rwX
      recurse: yes
    with_items:
      - "{{ project_dir_pls }}/logs"
      - "{{ project_dir_pls }}/temp"
      - "{{ filesfolder_pls }}"
    tags: dirs

  # Установить файл config.php с переменными
  - name: Copy config.php
    template:
      src: files/config_pls.php
      dest: "{{ project_dir_pls }}/config/config.php"
      backup: yes
    tags: conf

  - name: Run Migrate autolaunch
    shell: php public/index.php Light/Migrate
    args:
      chdir: "{{ project_dir_pls }}"
      executable: /bin/bash
    tags: migrate

    # Создать символические ссылки на папки для nginx
  - name: Create lightpublic symlink
    file:
      state: link
      src: "{{ project_dir_pls }}/src/Light/public"
      path: "{{ project_dir_pls }}/public/lightpublic"
    tags: dirs

  - name: Create symlink files/ShipmentAccounting -> files/Shipment
    file:
      state: link
      src: "{{ filesfolder_pls }}/Shipment"
      path: "{{ filesfolder_pls }}/ShipmentAccounting"
    tags: dirs

  - name: Run Sentry Deploy script
    shell: "{{ project_dir_pls }}/sentry.sh"
    args:
      chdir: "{{ project_dir_pls }}"
      executable: /bin/bash
    tags: sentry

  - name: Cron Light/CurrencyRateCBRF today at 6am
    become: false
    cron:
      name: "pls CurrencyRateCBRF today"
      minute: "0"
      hour: "6"
      job: "php {{ project_dir_pls }}/public/index.php Light/CurrencyRateCBRF today"
    tags: cron

  - name: Cron Light/CurrencyRateCBRF every 30 min 11-18
    become: false
    cron:
      name: "pls CurrencyRateCBRF"
      minute: "*/30"
      hour: "11-18"
      job: "php {{ project_dir_pls }}/public/index.php Light/CurrencyRateCBRF"
    tags: cron

  - name: Cron CitadeleCurrencyLoader every hour 9-21
    become: false
    cron:
      name: "pls CitadeleCurrencyLoader"
      state: absent
    tags: cron

  - name: Cron UpdateCustomerOutstandingCache at 8
    become: false
    cron:
      name: "pls UpdateCustomerOutstandingCache"
      minute: "7"
      hour: "0"
      job: "php {{ project_dir_pls }}/public/index.php UpdateCustomerOutstandingCache"
    tags: cron

  - name: Cron UpdateShipmentCriteria at 0:10
    become: false
    cron:
      name: "pls UpdateShipmentCriteria"
      minute: "10"
      hour: "0"
      job: "php {{ project_dir_pls }}/public/index.php UpdateShipmentCriteria"
    tags: cron

  - name: Cron Light/Email every minute
    become: false
    cron:
      name: "pls Light/Email"
      minute: "*"
      hour: "8-23"
      job: "php {{ project_dir_pls }}/public/index.php Light/Email"
    tags: cron

  - name: Cron Light/BackupMysqlData at 6:15
    become: false
    cron:
      name: "pls Light/BackupMysqlData"
      minute: "15"
      hour: "6"
      job: "php {{ project_dir_pls }}/public/index.php Light/BackupMysqlData"
    tags: cron

  - name: Cron Backup Database Logs Tables (once per month)
    become: false
    cron:
      name: "pls Light/BackupMysqlLogs"
      hour: 5
      minute: 30
      day: 3
      job: "php {{ project_dir_pls }}/public/index.php Light/BackupMysqlLogs"
    tags: cron

  - name: Cron EmailPendingQuotations14days at 16:30 working days
    become: false
    cron:
      name: "pls EmailPendingQuotations14days"
      minute: "30"
      hour: "16"
      weekday: "1-5"
      job: "php {{ project_dir_pls }}/public/index.php EmailPendingQuotations14days"
    tags: cron
